[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "norwegian-public-transport-analytics"
version = "0.1.0"
description = "Analytics pipeline for Norwegian public transport data from Entur"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"